# Builds the server image and deploys it to the cloud server.
#
# Automatic: after CI passes on a push to main, build the image, publish it to GitHub Container Registry
# (ghcr.io/<owner>/health-review, tags sha-<commit> and latest), then deploy that tag over SSH.
# Manual (Actions tab > Deploy > Run workflow): deploy any published tag again, or roll back to the previous one.
#
# The deploy step stays off until the server exists: set the repository variable DEPLOY_ENABLED to true
# (Settings > Secrets and variables > Actions > Variables) once these repository secrets are in place:
#   DEPLOY_HOST          the server's static IP address
#   DEPLOY_USER          the SSH user deploy.sh runs as: deploy (in the docker group; owns /opt/health-review/state)
#   DEPLOY_SSH_KEY       private half of the deploy key; its authorized_keys line forces /opt/health-review/deploy.sh
#   DEPLOY_KNOWN_HOSTS   the server's host key line (ssh-keyscan <address>), so GitHub never trusts an impostor
# GitHub holds nothing else: the app's secrets and data stay on the server.
# The image holds code only (Dockerfile, .dockerignore), so its package is public: after the first build, set
# ghcr.io/<owner>/health-review to Public (the package's settings), and the server pulls it without signing in.
#
# Weekly security rebuild (Mondays 13:00 UTC, after Dependabot's morning updates): runs the checks again, then builds
# the current main with the newest Node base image and this month's country database (US-only access), scans it, and
# deploys it. Every image is scanned with Trivy before it is published; a fixable high or critical finding stops it.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      action:
        description: deploy a tag, or roll back to the previous good image
        type: choice
        options: [deploy, rollback]
        default: deploy
      tag:
        description: image tag to deploy (e.g. sha-1a2b3c4); empty builds and deploys the current main
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The weekly rebuild has no CI run before it (an auto-merged update does not start one), so it runs the checks here.
  checks:
    name: Weekly checks
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run check:security

  image:
    name: Build, scan and publish image
    needs: checks
    # After a passing CI run on a push to main, the weekly rebuild once its checks pass, or a manual fresh build.
    if: >-
      always() && (
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
      (github.event_name == 'schedule' && needs.checks.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy' && inputs.tag == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.names.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The exact commit CI tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: names
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/health-review" >> "$GITHUB_OUTPUT"
          # The weekly rebuild of an unchanged commit gets its own tag, so the previous image stays there to roll back to.
          if [ "$EVENT" = "schedule" ]; then echo "tag=sha-${SHA::7}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"; else echo "tag=sha-${SHA::7}" >> "$GITHUB_OUTPUT"; fi
          echo "stamp=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built first into the runner only, so the scan below can stop a vulnerable image before it is published.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          build-args: GEO_STAMP=${{ steps.names.outputs.stamp }}
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
          cache-from: type=gha
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
          scan-type: image
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: GEO_STAMP=${{ steps.names.outputs.stamp }}
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: image
    # Runs after a fresh image, or on its own for a manual deploy of an existing tag or a rollback.
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' &&
      (needs.image.result == 'success' || (needs.image.result == 'skipped' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Choose what to run
        id: cmd
        env:
          ACTION: ${{ inputs.action }}
          INPUT_TAG: ${{ inputs.tag }}
          BUILT_TAG: ${{ needs.image.outputs.tag }}
        run: |
          if [ "$ACTION" = "rollback" ]; then
            echo "command=rollback" >> "$GITHUB_OUTPUT"
          else
            tag="${BUILT_TAG:-$INPUT_TAG}"
            if ! echo "$tag" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
              echo "Not an image tag: $tag" >&2
              exit 1
            fi
            echo "command=deploy $tag" >> "$GITHUB_OUTPUT"
          fi
      - name: Run deploy.sh on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          COMMAND: ${{ steps.cmd.outputs.command }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
            "${USER_NAME}@${HOST}" "$COMMAND"
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
